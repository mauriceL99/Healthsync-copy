# Relay with automatic HTTPS via Caddy.
#   HB_DOMAIN=relay.example.com docker compose -f deploy/docker-compose.yml up -d
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HB_RELAY_TRUST_PROXY: "1"
      HB_RELAY_REGISTRATION_TOKEN: ${HB_RELAY_REGISTRATION_TOKEN:-}
    volumes:
      - relay-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HB_DOMAIN: ${HB_DOMAIN:?set HB_DOMAIN to the relay host name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - relay
volumes:
  relay-data:
  caddy-data:

# XcodeGen spec for the HealthBridge iOS app.
# On a Mac, run ./setup.sh once: it asks for your Apple team and bundle-ID prefix, writes
# Configuration/Local.xcconfig (not checked in) and generates HealthBridge.xcodeproj.
# Afterwards `xcodegen` alone regenerates the project with the same values.

name: HealthBridge

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

# Team (DEVELOPMENT_TEAM) and bundle-ID prefix (HB_BUNDLE_ID_PREFIX) come from here; the
# file includes Configuration/Local.xcconfig written by setup.sh.
configFiles:
  Debug: Configuration/Signing.xcconfig
  Release: Configuration/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

fileGroups:
  - Configuration
  - README.md

targets:
  HealthBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthBridge
    settings:
      base:
        # Background-task, keychain and product IDs are derived from the bundle ID
        # (AppIdentifiers.swift). For the store edition, Configuration/Products.storekit
        # and App Store Connect must use the same prefix.
        PRODUCT_BUNDLE_IDENTIFIER: $(HB_BUNDLE_ID_PREFIX).healthbridge
        PRODUCT_NAME: HealthBridge
        INFOPLIST_FILE: HealthBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HealthBridge/HealthBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
        # Store edition only (needs a paid developer account): add
        #   com.apple.InAppPurchase: { enabled: 1 }
        # and STORE_EDITION to SWIFT_ACTIVE_COMPILATION_CONDITIONS (ios/README.md).

  HealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthBridgeTests
    dependencies:
      - target: HealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HB_BUNDLE_ID_PREFIX).healthbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        # Explicit host app so @testable import works with any XcodeGen version.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HealthBridge.app/HealthBridge
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HealthBridge:
    build:
      targets:
        HealthBridge: all
        HealthBridgeTests: [test]
    run:
      config: Debug
      # Local StoreKit testing (no App Store Connect products needed).
      storeKitConfiguration: Configuration/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HealthBridgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

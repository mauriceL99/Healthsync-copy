# XcodeGen spec for the HealthBridge iOS app.
# Generate the Xcode project with:  brew install xcodegen && xcodegen
# (run inside the ios/ directory). The generated HealthBridge.xcodeproj is not checked in.

name: HealthBridge

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Set your Apple Developer team ID here or in Xcode (Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

fileGroups:
  - Configuration
  - README.md

targets:
  HealthBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthBridge
    settings:
      base:
        # Placeholder bundle identifier. Replace com.example with your own reverse domain
        # (and update the product IDs, BGTask identifiers and Products.storekit accordingly).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthbridge
        PRODUCT_NAME: HealthBridge
        INFOPLIST_FILE: HealthBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HealthBridge/HealthBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.InAppPurchase:
          enabled: 1

  HealthBridgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthBridgeTests
    dependencies:
      - target: HealthBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthbridge.tests
        GENERATE_INFOPLIST_FILE: YES
        # Explicit host app so @testable import works with any XcodeGen version.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HealthBridge.app/HealthBridge
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HealthBridge:
    build:
      targets:
        HealthBridge: all
        HealthBridgeTests: [test]
    run:
      config: Debug
      # Local StoreKit testing (no App Store Connect products needed).
      storeKitConfiguration: Configuration/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HealthBridgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

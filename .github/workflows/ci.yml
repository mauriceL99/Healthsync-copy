name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - run: go run ./cmd/healthbridge self-test
  server-image:
    # Builds the server image (relay + agent) and smoke-tests it: an agent
    # onboarded against the relay container answers MCP over HTTP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: HB_DOMAIN=ci.example.com docker compose -f deploy/docker-compose.yml config -q
      - name: Build image
        run: docker build -f deploy/Dockerfile -t healthbridge:ci .
      - name: Smoke test
        run: |
          set -euo pipefail
          hb() { docker run --rm --network hb -v agent:/data -e HEALTHBRIDGE_HOME=/data --entrypoint /usr/local/bin/healthbridge healthbridge:ci "$@"; }
          docker network create hb
          docker run -d --name relay --network hb healthbridge:ci
          relay_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' relay)
          hb onboard --relay "http://$relay_ip:8787" --no-terminal-qr
          hb dev simulate-device --days 3
          docker run -d --name agent --network hb -v agent:/data -e HEALTHBRIDGE_HOME=/data -p 8788:8788 \
            --entrypoint /usr/local/bin/healthbridge healthbridge:ci serve --addr :8788
          url=$(hb connector-url --public-url http://localhost:8788)
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8788/healthz && break; sleep 1; done
          call() { curl -fsS -X POST -H 'Content-Type: application/json' --data "$1" "$url"; }
          call '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"health_sync","arguments":{}}}'
          call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"health_summary","arguments":{"period":"week"}}}' | tee summary.json
          grep -q 'Health summary' summary.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' http://localhost:8788/mcp/wrong)" = 404
      - name: Logs
        if: failure()
        run: docker logs relay; docker logs agent
  vectors-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS test vectors match the Go vectors
        run: cmp testdata/protocol_vectors.json ios/HealthBridgeTests/Resources/protocol_vectors.json
  ios:
    # Builds the app and runs the protocol-vector unit tests in the simulator.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Test
        run: |
          cd ios
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          xcodebuild test -project HealthBridge.xcodeproj -scheme HealthBridge \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
          exit ${PIPESTATUS[0]}
      - name: Build store edition (StoreKit code stays compilable)
        run: |
          cd ios
          xcodebuild build -project HealthBridge.xcodeproj -scheme HealthBridge \
            -destination "generic/platform=iOS Simulator" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG STORE_EDITION' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit ${PIPESTATUS[0]}
